name: Docker build & push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build, e.g. v1.0.5 (empty = build main as edge)'
        required: false
        default: ''
  push:
    tags: ['v*']
  # Pull requests only run the tests; nothing is built or pushed.
  pull_request:

permissions:
  contents: read

env:
  # The release being built: the pushed tag, or the tag given for a manual run.
  VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Same Python as the image (see PYTHON_VERSION in the Dockerfile).
    container: python:3.15-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION || github.ref }}
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # A manual run with a tag builds that tag's code, using this (newer) workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION || github.ref }}

      # No QEMU needed: every RUN step in the Dockerfile runs on the build platform.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/talos-config-manager
          # Tag v1.2.3 -> 1.2.3, 1.2, 1 and latest.
          # Manual run on main without a tag -> edge.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=latest,enable=${{ env.VERSION != '' }}
            type=raw,value=edge,enable=${{ env.VERSION == '' && github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
