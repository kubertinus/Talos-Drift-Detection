name: Docker build & push

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    runs-on: custom-ubuntu
    steps:
      - uses: actions/checkout@v4

      # Emulation for the non-native architecture (the Python dependency install runs per platform).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # TEMPORARY: diagnose "Could not resolve host: github.com" in RUN steps. Never fails.
      - name: DNS diagnostics
        continue-on-error: true
        run: |
          set +e
          echo "== job container"; cat /etc/resolv.conf; getent hosts github.com
          for img in debian:trixie-slim cgr.dev/chainguard/go:latest; do
            echo "== docker run $img"
            docker run --rm --entrypoint sh "$img" -c 'cat /etc/resolv.conf; getent hosts github.com || echo "getent FAILED"; git ls-remote https://github.com/go-acme/lego.git HEAD 2>&1 | tail -1'
          done
          for img in debian:trixie-slim cgr.dev/chainguard/go:latest; do
            echo "== buildx RUN in $img"
            printf 'FROM %s\nRUN cat /etc/resolv.conf; cat /etc/hosts; getent hosts github.com || echo "getent FAILED"\n' "$img" \
              | docker buildx build --no-cache --progress=plain -f - . 2>&1 | grep -E '^#[0-9]+ [0-9.]+ |ERROR'
          done

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/talos-drift-detector
          # Git tag v1.2.3 -> 1.2.3, 1.2, 1 and latest (newest release only).
          # Push to main without a tag -> edge.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}