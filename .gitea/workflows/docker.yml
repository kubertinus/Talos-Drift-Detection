name: Docker build & push

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    runs-on: custom-ubuntu
    steps:
      - uses: actions/checkout@v4

      # Emulation for the non-native architecture (the Python dependency install runs per platform).
      - uses: docker/setup-qemu-action@v3

      # The runner's own resolver (e.g. 127.0.0.53) isn't reachable from BuildKit's build
      # containers, so RUN steps couldn't resolve github.com. Give BuildKit explicit DNS servers;
      # replace them with an internal resolver if outbound DNS is blocked on the runner network.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/talos-drift-detector
          # Git tag v1.2.3 -> 1.2.3, 1.2, 1 and latest (newest release only).
          # Push to main without a tag -> edge.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}