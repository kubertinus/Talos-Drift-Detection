name: Docker build & push

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    runs-on: custom-ubuntu
    steps:
      - uses: actions/checkout@v4

      # Emulation for the non-native architecture (the Python dependency install runs per platform).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # TEMPORARY: compare name resolution of Debian and Wolfi images inside BuildKit. Never fails.
      - name: DNS diagnostics
        continue-on-error: true
        run: |
          set +e
          for platforms in linux/amd64 linux/amd64,linux/arm64; do
            for img in python:3.14-slim cgr.dev/chainguard/python:latest-dev; do
              echo "=================== $img | $platforms"
              printf 'FROM %s\nCOPY dnscheck.py /tmp/dnscheck.py\nRUN python /tmp/dnscheck.py\n' "$img" \
                | docker buildx build --no-cache --progress=plain --platform "$platforms" -f - .gitea/diag 2>&1 \
                | grep -E '^#[0-9]+ [0-9.]+ |ERROR' | sed -E 's/^#[0-9]+ [0-9.]+ //'
            done
          done

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/talos-drift-detector
          # Git tag v1.2.3 -> 1.2.3, 1.2, 1 and latest (newest release only).
          # Push to main without a tag -> edge.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}