name: Docker build & push

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    runs-on: custom-ubuntu
    steps:
      - uses: actions/checkout@v4

      # Emulation for the non-native architecture (the Python dependency install runs per platform).
      - uses: docker/setup-qemu-action@v3

      # On this runner RUN steps get no network in BuildKit's own per-step network (CNI):
      # "Could not resolve host: github.com". Run BuildKit and its build steps on the
      # runner's host network instead, with the runner's own DNS.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/talos-drift-detector
          # Git tag v1.2.3 -> 1.2.3, 1.2, 1 and latest (newest release only).
          # Push to main without a tag -> edge.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}