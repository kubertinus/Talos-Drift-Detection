{% extends "settings_layout.html" %}
{% block title %}New cluster · Talos Config Manager{% endblock %}
{% block settings %}
<h1 class="text-2xl font-semibold text-white mb-2">New cluster</h1>
<p class="text-sm text-slate-400 mb-6">
  Give the cluster a name. Then choose the base folder with the talosconfig, controlplane.yaml,
  worker.yaml and any patches.
</p>
<form method="post" action="/settings/new" class="card p-5 flex flex-wrap gap-3 max-w-xl">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input name="name" required maxlength="60" autofocus class="input flex-1 min-w-[12rem]" placeholder="Name, e.g. production">
  <button class="btn-primary">Add</button>
</form>
{% endblock %}
