<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="cluster-id" content="{{ cluster.id if cluster else '' }}">
  <title>{% block title %}Talos Config Manager{% endblock %}</title>
  <script src="/static/vendor/tailwindcss-3.4.16.js"></script>
  <script defer src="/static/vendor/alpinejs-3.14.1.min.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-950 text-slate-200 antialiased">
  {% block body %}
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
    <div class="mx-auto max-w-7xl px-4 h-14 flex items-center gap-6">
      <a href="/" class="flex items-center gap-2 font-semibold text-white">
        <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg>
        Talos Config Manager
      </a>
      <nav class="flex items-center gap-1 text-sm">
        <a href="/" class="nav-link {% if request.url.path == '/' or request.url.path.startswith('/c/') %}active{% endif %}">Overview</a>
        <a href="/settings" class="nav-link {% if request.url.path.startswith('/settings') %}active{% endif %}">Settings</a>
      </nav>
      <div class="ml-auto flex items-center gap-3" x-data="scanner({{ 'true' if running else 'false' }}, {{ (cluster.id if cluster else '') | tojson | forceescape }})">
        <button @click="scan()" :disabled="running" class="btn-primary">
          <svg x-show="running" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3"/></svg>
          <span x-text="running ? 'Scanning…' : '{{ 'Scan now' if cluster else 'Scan all' }}'"></span>
        </button>
        {% if user_name %}<span class="hidden sm:inline text-sm text-slate-400" title="Logged in as {{ user_name }}">{{ user_name }}</span>{% endif %}
        <form method="post" action="/logout"><button class="text-sm text-slate-400 hover:text-white">Log out</button></form>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
